name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python scripts/check_scenarios.py
      - run: python -m pytest -q --cov=src --cov-report=term-missing --cov-report=json --cov-report=xml --cov-report=html --cov-fail-under=80 --junitxml=junit.xml
      - run: python scripts/coverage_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: scenario-metrics
          path: |
            docs/coverage-report.md
            docs/traceability.md
            coverage.json
            coverage.xml
            junit.xml
            htmlcov/
  publish-metrics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests-and-scenarios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: scenario-metrics
      - name: Commit automatically regenerated reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/coverage-report.md docs/traceability.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(metrics): regenerate scenario coverage and RTM [skip ci]'
            git push
          fi
